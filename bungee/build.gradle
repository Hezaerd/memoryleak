plugins {
    id 'java'
    id 'me.modmuss50.mod-publish-plugin'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://libraries.minecraft.net')
        content { includeGroup('com.mojang') }
    }
}

dependencies {
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.3'
}

sourceSets.main.java.srcDir project(':core').file('src/main/java')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}
tasks.named('compileJava', JavaCompile) {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}
tasks.named('processResources', ProcessResources) {
    inputs.property('version', project.version)
    filesMatching('bungee.yml') { expand(version: project.version) }
}

tasks.named('jar', Jar) {
    archiveBaseName = "memory-leak-bungee"
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = rootProject.ext.releaseChangelog
    version = "${project.version}+bungee"
    displayName = "${mod_name} ${project.version} for BungeeCord and Waterfall"
    type = STABLE
    modLoaders.addAll(['bungeecord', 'waterfall'])

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = 'Aqk3l0pH'
        minecraftVersions.addAll(['1.8', '1.8.1', '1.8.2', '1.8.3', '1.8.4', '1.8.5', '1.8.6', '1.8.7', '1.8.8', '1.8.9',
                '1.9', '1.9.1', '1.9.2', '1.9.3', '1.9.4', '1.10', '1.10.1', '1.10.2', '1.11', '1.11.1', '1.11.2',
                '1.12', '1.12.1', '1.12.2', '1.13', '1.13.1', '1.13.2', '1.14', '1.14.1', '1.14.2', '1.14.3', '1.14.4',
                '1.15', '1.15.1', '1.15.2', '1.16', '1.16.1', '1.16.2', '1.16.3', '1.16.4', '1.16.5',
                '1.17', '1.17.1', '1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
                '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
                '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7',
                '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2'])
    }
}
