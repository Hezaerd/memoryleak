plugins {
    id 'java'
    id 'me.modmuss50.mod-publish-plugin'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://libraries.minecraft.net')
        content { includeGroup('com.mojang') }
    }
}

dependencies {
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.3'
}

sourceSets.main.java.srcDir project(':core').file('src/main/java')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}
tasks.named('compileJava', JavaCompile) {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}
tasks.named('processResources', ProcessResources) {
    inputs.property('version', project.version)
    filesMatching('bungee.yml') { expand(version: project.version) }
}

tasks.named('jar', Jar) {
    archiveBaseName = "memory-leak-bungee"
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = rootProject.ext.readReleaseChangelog(project.version.toString())
    version = "${project.version}+bungee"
    displayName = "${mod_name} ${project.version} for BungeeCord and Waterfall"
    type = STABLE
    modLoaders.addAll(['bungeecord', 'waterfall'])

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = 'Aqk3l0pH'
        minecraftVersions.addAll(['1.21', '1.21.1'])
    }
}
