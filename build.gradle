plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0' apply false
}

ext.readReleaseChangelog = { String releaseVersion ->
    File changelogFile = rootProject.file("CHANGELOG.md")

    if (!changelogFile.exists()) {
        throw new GradleException("Missing CHANGELOG.md")
    }

    String text = changelogFile.getText("UTF-8").replace("\r\n", "\n").trim()
    if (text.isEmpty()) {
        throw new GradleException("CHANGELOG.md is empty")
    }

    def matcher = (text =~ /(?ms)^##\s+(.+?)\n(.*?)(?=^##\s+|\z)/)
    while (matcher.find()) {
        String heading = matcher.group(1).trim()
        String body = matcher.group(2).trim()

        if (heading == releaseVersion || heading.startsWith(releaseVersion + " ")) {
            return "## ${heading}\n\n${body}".trim()
        }
    }

    throw new GradleException("No changelog section found for version ${releaseVersion} in CHANGELOG.md")
}