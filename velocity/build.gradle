plugins {
    id 'java'
    id 'me.modmuss50.mod-publish-plugin'
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.5.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.5.1'
}

sourceSets.main.java.srcDir project(':core').file('src/main/java')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}
tasks.named('compileJava', JavaCompile) {
    options.release = 21
    options.compilerArgs << '-Xlint:-options'
}

tasks.named('jar', Jar) {
    archiveBaseName = "memory-leak-velocity"
}
tasks.named('jar', Jar) {
    inputs.property('version', project.version)
    filesMatching('velocity-plugin.json') { expand(version: project.version) }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = rootProject.ext.readReleaseChangelog(project.version.toString())
    version = "${project.version}+velocity"
    displayName = "${mod_name} ${project.version} for Velocity"
    type = STABLE
    modLoaders.addAll(['velocity'])

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = 'Aqk3l0pH'
        minecraftVersions.addAll(['1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3'])
    }
}
