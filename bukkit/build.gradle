plugins {
    id 'java'
    id 'me.modmuss50.mod-publish-plugin'
}

repositories {
    mavenCentral()
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
}

dependencies {
    compileOnly('org.spigotmc:spigot-api:1.13.2-R0.1-SNAPSHOT') { transitive = false }
}

sourceSets.main.java.srcDir project(':core').file('src/main/java')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}
tasks.named('compileJava', JavaCompile) {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}
tasks.named('processResources', ProcessResources) {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') { expand(version: project.version) }
}

tasks.named('jar', Jar) {
    archiveBaseName = "memory-leak-bukkit"
}
tasks.register('printJava8') {
    def java8 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    doLast { println java8.get().executablePath.asFile.absolutePath }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = rootProject.ext.readReleaseChangelog(project.version.toString())
    version = "${project.version}+bukkit"
    displayName = "${mod_name} ${project.version} for Bukkit"
    type = STABLE
    modLoaders.addAll(['bukkit', 'spigot', 'paper', 'purpur', 'folia'])

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = 'Aqk3l0pH'
        minecraftVersions.addAll(['1.13.2', '1.14', '1.14.1', '1.14.2', '1.14.3', '1.14.4',
                '1.15', '1.15.1', '1.15.2', '1.16', '1.16.1', '1.16.2', '1.16.3', '1.16.4', '1.16.5',
                '1.17', '1.17.1', '1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
                '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
                '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7',
                '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3'])
    }
}
